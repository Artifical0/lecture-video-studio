<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>录课视频工坊</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f6f8;--surface:#fff;--fg:#18202f;--mut:#8a93a3;--line:#e4e7ec;--acc:#3b5bdb;--acc-2:#2f4ac0;--err:#c4320a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b23;--fg:#e9ecf2;--mut:#7d8697;--line:#2a303c;--acc:#7b93ff;--acc-2:#97a9ff;--err:#ff8a70}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:36px 32px 30px;width:min(380px,100%);box-shadow:0 12px 32px rgba(16,24,40,.08)}
.mark{width:44px;height:44px;border-radius:12px;background:var(--acc);display:grid;place-items:center;margin-bottom:18px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--mut);margin:0 0 24px;font-size:13px}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:15px}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:9px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:var(--acc-2)}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}
</style></head><body>
<form method="post" action="/login">
  <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z" fill="#fff"/></svg></div>
  <h1>录课视频工坊</h1><p>课件 + 讲稿 → 克隆音色配音 → 带字幕的录课视频</p>
  <input type="password" name="password" placeholder="访问密码" autofocus required>
  <div class="err">{{ERR}}</div>
  <button>进入</button>
</form></body></html>
